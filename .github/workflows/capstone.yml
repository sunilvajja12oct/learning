name: Capstone Pipeline

on:
  push:
    branches: [main, 'feature/**']

jobs:
  build-scan-deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t capstone-app ./week1-foundations/capstone

      - name: Security scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL capstone-app

      - name: Deploy container
        run: |
          docker run -d --name capstone-app-container -p 8000:8000 capstone-app
          for i in $(seq 1 10); do
            if curl -s -o /dev/null http://127.0.0.1:8000/health; then
              echo "Container is up after $i attempt(s)"
              break
            fi
            echo "Not ready yet, retry $i"
            sleep 2
          done
          
      - name: Show container status (debug)
        if: always()
        run: |
          docker ps -a
          docker logs capstone-app-container || true

      - name: Health check
        run: |
          chmod +x week1-foundations/capstone/healthcheck.sh
          ./week1-foundations/capstone/healthcheck.sh

      - name: cleanup
        if: always()
        run: docker rm -f capstone-app-container